<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>存档与分支 · 预览</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0c0c0e;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .mock-st-header {
      height: 52px;
      background: rgba(24, 24, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mock-st-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .mock-st-pill {
      font-size: 12px;
      font-weight: 500;
      color: rgba(235, 235, 245, 0.56);
    }

    .mock-open-btn {
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      border: none;
      background: #0a84ff;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.14s ease;
    }

    .mock-open-btn:hover {
      background: #2997ff;
    }

    .mock-chat-shell {
      width: min(760px, 92vw);
      margin: 32px auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mock-msg {
      background: #18181a;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 14px 16px;
      line-height: 1.65;
      font-size: 14px;
      color: rgba(235, 235, 245, 0.88);
    }

    .mock-msg.is-user {
      background: rgba(10, 132, 255, 0.14);
      border-color: rgba(10, 132, 255, 0.24);
    }

    .mock-msg-meta {
      font-size: 12px;
      color: rgba(235, 235, 245, 0.42);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header class="mock-st-header">
    <div class="mock-st-title">
      <span>SillyTavern</span>
      <span class="mock-st-pill" id="mockActiveIndicator"></span>
    </div>
    <button type="button" class="mock-open-btn" id="openManagerBtn">存档与分支</button>
  </header>

  <div class="mock-chat-shell">
    <div id="mockChatMessages" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <script type="module">
    import { adapter, modal } from './index.js';

    function renderMockHostChat() {
      const state = adapter.getMockCurrentChatLines();
      const indicator = document.getElementById('mockActiveIndicator');
      const container = document.getElementById('mockChatMessages');

      if (!state.character) return;
      indicator.textContent = `${state.character.name} · ${state.chatId}`;

      container.innerHTML = state.lines
        .map(
          (m, idx) => `
          <div class="mock-msg ${m.is_user ? 'is-user' : ''}">
            <div class="mock-msg-meta">
              <strong>#${idx + 1} ${m.name}</strong>
              <span>${m.send_date || ''}</span>
            </div>
            <div>${m.mes}</div>
          </div>
        `
        )
        .join('');
    }

    adapter.onMockStateChange(() => renderMockHostChat());
    renderMockHostChat();

    document.getElementById('openManagerBtn').addEventListener('click', () => modal.open());

    modal.open();
  </script>
</body>
</html>
